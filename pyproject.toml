[project]
name = "toxicity-oss-discord-research"
version = "0.1.0"
description = "Pipeline de dados Discord para pesquisa em Engenharia de Software"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "pytest>=8.4.2",
    "rich>=14.3.3",
    "scipy>=1.15.0",
    "typer>=0.24.1",
    "zstandard>=0.25.0",
]

[project.scripts]
discord-data = "discord_data.cli:main"
discord-filter = "discord_filtering.cli:main"
discord-prepare = "discord_disentanglement.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_data", "discord_filtering", "discord_disentanglement"]
